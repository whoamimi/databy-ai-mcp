site_name: Databy AI MCP Connector
site_description: Data engineering capabilities as a Claude MCP connector, built on FastMCP.
site_author: Mimi Phan

docs_dir: docs

nav:
  - Home: index.md
  - Setup: docs/posts/01_setup.md
  - Roadmap: docs/todos/2808.md

theme:
  name: material
  logo: dinos/dino_tail.png
  favicon: dinos/dino_tail.png
  palette:
    - scheme: slate
      primary: custom
      accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top.hide
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true

extra:
  generator: false

plugins:
  - social
